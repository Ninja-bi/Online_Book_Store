[project]
name = "online-book-store"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ninja-bi", email = "aashutoshk2727@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.2",
    "djangorestframework>=3.18.3",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.30.0",
    "pillow>=13.0.0",
    "django-unfold>=0.110.0",
    "cashfree-pg>=6.0.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
online-book-store = "online_book_store:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"
