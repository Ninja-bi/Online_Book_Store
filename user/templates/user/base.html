{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}Online Book Store{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="{% static 'user/css/auth.css' %}"/>
</head>
<body>
  <!-- ─── Navbar ─────────────────────────────────────────── -->
  <nav class="navbar">
    <a href="/" class="nav-logo">
      <span class="logo-n">N</span><span class="logo-dot">◉</span><span class="logo-ook">ook</span>
    </a>
    <div class="nav-links">
      <a href="{% url 'user-login' %}" class="nav-link {% block nav_login %}{% endblock %}">Sign In</a>
      <span class="nav-sep">/</span>
      <a href="{% url 'user-register' %}" class="nav-link {% block nav_join %}{% endblock %}">Join</a>
    </div>
  </nav>

  <!-- ─── Main content ──────────────────────────────────── -->
  <main class="auth-main">
    {% block content %}{% endblock %}
  </main>

  <!-- ─── Footer ───────────────────────────────────────── -->
  <footer class="footer">
    <span>© 2026 NOOK Books. A sanctuary for curated editions.</span>
    <div class="footer-links">
      <a href="#">Privacy</a>
      <a href="#">Terms</a>
      <a href="#">Help</a>
    </div>
  </footer>

  {% block extra_js %}{% endblock %}
</body>
</html>
